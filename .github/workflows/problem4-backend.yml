name: Problem 4 backend
on:
  pull_request:
    paths: ['src/problem3/api/**', 'src/problem4/Dockerfile', 'src/problem4/compose.yaml', 'src/problem4/frontend/**', '.dockerignore', 'src/problem4/scripts/**', 'src/problem4/tests/**', 'src/problem4/deploy/**', '.github/workflows/problem4-backend.yml']
  push:
    branches: [main]
    paths: ['src/problem3/api/**', 'src/problem4/Dockerfile', 'src/problem4/compose.yaml', 'src/problem4/frontend/**', '.dockerignore', 'src/problem4/scripts/**', 'src/problem4/tests/**', 'src/problem4/deploy/**', '.github/workflows/problem4-backend.yml']
  workflow_dispatch:
    inputs:
      release_sha:
        description: Previously archived full commit SHA to recover
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.sha }}
      API_IMAGE: problem4-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Build shared Problem 3 API
        run: docker build --build-arg RELEASE_SHA="$RELEASE_SHA" -f src/problem4/Dockerfile -t "$API_IMAGE" .
      - name: Test real image and recovery with PostgreSQL and Redis
        run: SKIP_BUILD=1 bash src/problem4/tests/docker.sh
      - run: bash src/problem4/tests/releases.sh
      - run: bash src/problem4/tests/host-contract.sh
      - name: Package tested application
        run: |
          bash src/problem4/scripts/package-backend.sh "$API_IMAGE" "$RELEASE_SHA" backend.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-${{ github.sha }}
          path: backend.tar.gz
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: build
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && needs.build.result == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production-backend
    concurrency:
      group: problem4-production-backend
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      INSTANCE_ID: ${{ vars.INSTANCE_ID }}
      RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Validate recovery identifier
        run: '[[ $RELEASE_SHA =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'push'
        with:
          name: backend-${{ github.sha }}
          path: release
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: backend-${{ github.run_id }}
      - name: Release tested archive
        if: github.event_name == 'push'
        run: bash src/problem4/scripts/release-backend.sh release "$RELEASE_SHA" release/backend.tar.gz
      - name: Recover archived release
        if: github.event_name == 'workflow_dispatch'
        run: bash src/problem4/scripts/release-backend.sh recover "$RELEASE_SHA"
