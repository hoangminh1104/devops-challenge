version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${ECR_REPO%/*}"
  build:
    commands:
      - docker build -t "$ECR_REPO:$APP_TAG" app
      - docker run -d --name dom7hc-practice-test-db -e POSTGRES_PASSWORD=local-test-only -e POSTGRES_DB=trading -p 127.0.0.1:55432:5432 postgres:18-alpine
      - for i in $(seq 1 30); do docker exec dom7hc-practice-test-db pg_isready -U postgres && break || sleep 1; done
      - docker run --rm --network host -e DB_PORT=55432 -v "$CODEBUILD_SRC_DIR/app:/work" -w /work node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205 sh -c 'npm ci --registry=https://registry.npmjs.org && npm test'
      - docker rm -f dom7hc-practice-test-db
      - docker push "$ECR_REPO:$APP_TAG"
      - |
        if ! aws ecr describe-images --repository-name dom7hc-practice-app --image-ids imageTag=load-v5 >/dev/null 2>&1; then
          docker build -t "$ECR_REPO:load-v5" load
          docker push "$ECR_REPO:load-v5"
        fi
  post_build:
    commands:
      - aws ecr describe-images --repository-name dom7hc-practice-app --image-ids imageTag="$APP_TAG" --query 'imageDetails[0].{digest:imageDigest,tags:imageTags}'
