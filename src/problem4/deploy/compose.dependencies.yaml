# Bootstrap only. Never invoked by an API release.
services:
  postgres:
    image: postgres:16.13-alpine
    restart: unless-stopped
    env_file:
      - path: ${API_ENV_FILE:-/etc/ship-api.env}
        format: raw
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    networks: [data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 2s
      retries: 30
volumes:
  postgres-data:
networks:
  data:
    name: ${DATA_NETWORK:-ship-api-data}
